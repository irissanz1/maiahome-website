name: Refrescar cache Beds24 (respaldo)

# La ficha/reserva verifica disponibilidad EN VIVO contra Beds24 (protege contra
# doble-booking). Esta cache alimenta el LISTADO y el calendario; se refresca cada
# 4 h para que las reservas same-day se reflejen pronto (antes era 1x/día y las
# reservas posteriores a la corrida no salían en el listado hasta el día siguiente).
on:
  schedule:
    - cron: "0 */4 * * *" # cada 4 h (00,04,08,12,16,20 UTC)
  workflow_dispatch: {} # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: refresh-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Beds24 → data/beds24-cache.json
        env:
          BEDS24_LONG_LIFE_TOKEN: ${{ secrets.BEDS24_LONG_LIFE_TOKEN }}
        run: node scripts/sync-cache.mjs || echo "::warning::sync terminó incompleto o con error (exit $?)"

      - name: Commit y push si la cache cambió
        run: |
          git config user.name "maia-bot"
          git config user.email "maia-bot@users.noreply.github.com"
          git add data/beds24-cache.json
          if git diff --cached --quiet; then
            echo "Sin cambios en la cache."
          else
            git commit -m "chore: refresco de cache Beds24 (cada 4h)"
            git push
          fi
