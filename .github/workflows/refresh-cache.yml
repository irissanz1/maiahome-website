name: Refrescar cache Beds24 (respaldo)

# La disponibilidad del sitio es EN VIVO directo de Beds24; esta cache es solo el
# respaldo para cuando Beds24 no responde. La refrescamos cada madrugada.
on:
  schedule:
    - cron: "0 10 * * *" # 04:00 CDMX (UTC-6)
  workflow_dispatch: {} # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: refresh-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Beds24 → data/beds24-cache.json
        env:
          BEDS24_LONG_LIFE_TOKEN: ${{ secrets.BEDS24_LONG_LIFE_TOKEN }}
        run: node scripts/sync-cache.mjs || echo "::warning::sync terminó incompleto o con error (exit $?)"

      - name: Commit y push si la cache cambió
        run: |
          git config user.name "maia-bot"
          git config user.email "maia-bot@users.noreply.github.com"
          git add data/beds24-cache.json
          if git diff --cached --quiet; then
            echo "Sin cambios en la cache."
          else
            git commit -m "chore: refresco nocturno de cache Beds24 (respaldo)"
            git push
          fi
